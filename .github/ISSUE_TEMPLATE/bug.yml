name: Fault report
description: Something in the desktop does not match documented behavior.
title: "[FAULT] "
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - boot
        - window manager
        - terminal
        - cortex
        - library
        - synth
        - graph
        - manifesto
        - oracle
        - chronos
        - lexicon
        - moodboard
        - docs / CI
        - other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Documented / expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport
      placeholder: "1440×900, Chrome 131, macOS"
